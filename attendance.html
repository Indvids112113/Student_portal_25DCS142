<!DOCTYPE html>
<html lang="en">
<head>
    <title>Attendance Page</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            background: url("5590457.jpg") no-repeat center center fixed;
            background-size: cover;
        }
        .navbar {
            background-color: rgba(45, 98, 159, 0.933);
            padding: 12px;
            text-align: center;
        }
        .navbar a {
            color: aliceblue;
            text-decoration: none;
            padding: 10px 15px;
            margin: 0px 8px;
            border-radius: 8px;
            transition: background 0.3s ease;
        }
        .navbar a:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .attendance-box {
            background: rgba(129, 120, 120, 0.386);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 500px;
            margin: 30px auto;
        }
        .attendance-box h1 {
            background-color: aliceblue;
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 8px;
        }
        .attendance-item {
            display: flex;
            background: rgba(255,255,255,0.7);
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            font-weight: bold;
            color: #333;
        }
        .subject {
            width: 250px;   
            text-align: left;
        }
        .attended {
            width: 130px;
            text-align: center;
        }
        .percentage {
            width: 100px;
            text-align: center;
            color: rgb(45, 98, 159);
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="studentindexpage.html">Home</a>
        <a href="result.html">Results</a>
        <a href="subject.html">Subjects</a>
        <a href="fees.html">Fees</a>
        <a href="event.html">Events</a>
    </div>
    <div class="attendance-box">
        <h1>ATTENDANCE</h1>

        <div class="attendance-item">
            <div class="subject">Data Structures</div>
            <div class="attended">18/20</div>
            <div class="percentage">90%</div>
        </div>

        <div class="attendance-item">
            <div class="subject">Object Oriented Programming</div>
            <div class="attended">15/20</div>
            <div class="percentage">75%</div>
        </div>

        <div class="attendance-item">
            <div class="subject">Web Development</div>
            <div class="attended">19/20</div>
            <div class="percentage">95%</div>
        </div>

        <div class="attendance-item">
            <div class="subject">Computer Networks</div>
            <div class="attended">16/20</div>
            <div class="percentage">80%</div>
        </div>

        <div class="attendance-item">
            <div class="subject">Liberal Arts</div>
            <div class="attended">17/20</div>
            <div class="percentage">85%</div>
        </div>
    </div>
</body>
</html>
