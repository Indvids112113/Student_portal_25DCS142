<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login Page</title>
    <style>
        body { 
            font-family: Arial, sans-serif;
            background: url("5590457.jpg") no-repeat center center fixed; 
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: rgba(255,255,255,0.3); 
            backdrop-filter: blur(10px);       
            -webkit-backdrop-filter: blur(10px); 
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.2);
            width: 350px;
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 20px;
            color: black;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block; 
            margin-bottom: 5px;
            color: black;
            font-weight: bold;
        }
        .input-group input {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 6px;
            background: rgba(255,255,255,0.6); 
        }
        .login-box input[type="submit"] {
            background: rgba(32, 137, 235, 0.841); 
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        .login-box input[type="submit"]:hover {
            background: rgb(78,161,224);
        }
        .login-box a {
            display: block;
            text-align: center;
            margin-top: 10px;
            color: #004ab1;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }
        .login-box a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <form action="studentindexpage.html" method="post" class="login-box">
        <h1>Login Page</h1>

        <div class="input-group">
            <label>Email ID:</label>
            <input type="text" placeholder="Enter Email ID">
        </div>
        <div class="input-group">
            <label>Password:</label>
            <input type="password" placeholder="Enter the Password">
        </div>
        <input type="submit" value="Login">
        <a href="signup.html">Don't have an account? Sign up here.</a>
        <a href="index.html">Back to Home</a>
    </form>
</body>
</html>
