<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Sign Up</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url("5590457.jpg") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background: rgba(255, 255, 255, 0.3); /* semi-transparent */
            backdrop-filter: blur(9px);           /* frosty blur effect */
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.2);
            width: 400px;
        }
        .form-container h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #000;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            color: #000;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 97%;
            padding: 8px;
            border: none;
            border-radius: 6px;
            background: rgba(255,255,255,0.6); /* frosty input */
        }
        .form-container input[type="submit"] {
            background: rgba(76, 175, 80, 0.8);
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        .form-container input[type="submit"]:hover {
            background: rgba(69, 160, 73, 0.9);
        }
        .links {
            text-align: center;
            margin-top: 15px;
        }
        .links a {
            color: #0044cc;
            text-decoration: none;
            font-weight: bold;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <form action="adminloginpage.html" method="post" class="form-container">
        <h1>Admin Sign Up</h1>
        <div class="input-group">
            <label>Admin Name:</label>
            <input type="text" placeholder="Enter Admin Name">
        </div>
        <div class="input-group">
            <label>Admin ID:</label>
            <input type="text" placeholder="Enter Admin ID">
        </div>
        <div class="input-group">
            <label>Email:</label>
            <input type="email" placeholder="Enter Admin Email">
        </div>
        <div class="input-group">
            <label>New Password:</label>
            <input type="password" placeholder="Password">
        </div>
        <div class="input-group">
            <label>Confirm Password:</label>
            <input type="password" placeholder="Re-enter Password">
        </div>
        <div class="input-group">
            <label>Admin Code:</label>
            <input type="text" placeholder="Enter Admin Code">
        </div>
        <input type="submit" value="Sign Up">
        <div class="links">
            <p>Already have an account? <a href="adminloginpage.html">Go to Login</a></p>
            <p><a href="index.html">Back to Home</a></p>
        </div>
    </form>
</body>
</html>
