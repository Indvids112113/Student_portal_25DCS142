<!DOCTYPE html>
<html lang="en">
<head>
    <title>Feedback Page</title>
    <style>
        body {
            background: url("5590457.jpg") no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Navigation Bar */
        .navbar {
            padding: 12px;
            text-align: center;
            background-color: rgba(45, 98, 159, 0.93);
        }
        .navbar a {
            padding: 10px 15px;
            margin: 0 8px;
            color: aliceblue;
            display: inline-block;
            border-radius: 12px;
            transition: background 0.3s ease;
            font-weight: bold;
            text-decoration: none;
        }
        .navbar a:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Feedback Box */
        .feedback-box {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            padding: 20px;
            margin: 100px auto;
            text-align: center;
            width: 400px;
            border-radius: 12px;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.2);
        }
        .feedback-box h2 {
            margin-bottom: 15px;
            color: #000;
        }
        .feedback-box textarea {
            width: 95%;
            height: 100px;
            border-radius: 8px;
            border: none;
            padding: 10px;
            resize: none;
            background: rgba(255,255,255,0.6);
        }
        .feedback-box input[type="submit"] {
            margin-top: 15px;
            background: rgba(45, 98, 159, 0.9);
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 90%;
            font-size: 16px;
        }
        .feedback-box input[type="submit"]:hover {
            background: rgba(35, 80, 130, 0.95);
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <div class="navbar">
        <a href="index.html">Home</a>
        <a href="signup.html">Sign-Up</a>
        <a href="loginpage.html">Login</a>
        <a href="aboutus.html">About Us</a>
        <a href="adminloginpage.html">Admin Login</a>
        <a href="adminsignuppage.html">Adimin Sign-Up</a>
    </div>

    <!-- Feedback Form -->
    <div class="feedback-box">
        <h2>We Value Your Feedback</h2>
            <textarea placeholder="Write your feedback here..."></textarea>
            <input type="submit" value="Submit Feedback">
        </form>
    </div>
</body>
</html>
