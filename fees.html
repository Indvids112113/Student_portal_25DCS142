<!DOCTYPE html>
<html lang="en">
<head>
    <title>FEES Page</title>
    <style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        background: url("5590457.jpg") no-repeat center center fixed;
        background-size: cover;
        margin: 0;
        padding: 0;
    }
    .navbar {
        background-color: rgba(45, 98, 159, 0.933);
        padding: 12px;
        text-align: center;
    }
    .navbar a {
        color: aliceblue;
        font-weight: bold;
        display: inline-block;
        text-decoration: none;
        margin: 0px 8px;
        padding: 10px 15px;
        border-radius: 8px;
        transition: background 0.3s ease;
    }
    .navbar a:hover {
         background: rgba(255, 255, 255, 0.2);
    }
    .feesBox {
        background: rgba(129, 120, 120, 0.386);
        backdrop-filter: blur(10px);
        margin: 30px auto;
        padding: 20px;
        border-radius: 12px;
        width: 400px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .feesBox h1 {
        text-align: center;
        background-color: aliceblue;
        margin-bottom: 20px;
        padding: 15px;
        border-radius: 8px;
    }
    .fee-item {
        display: flex;
        justify-content: space-between;
        background: rgba(255,255,255,0.7);
        padding: 12px;
        margin: 8px 0;
        border-radius: 6px;
        font-weight: bold;
        color: #333;
    }
    .status-paid {
        color: green;
    }
    .status-pending {
        color: red;
    }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="studentindexpage.html">Home</a>
        <a href="result.html">Results</a>
        <a href="Subject.html">Subjects</a>
        <a href="attendance.html">Attendance</a>
        <a href="event.html">Events</a>
    </div>

    <div class="feesBox">
        <h1>FEES STATUS</h1>

        <div class="fee-item">
            <div>Tuition Fees</div>
            <div class="status-paid">Paid</div>
        </div>
        <div class="fee-item">
            <div>Transports Fees</div>
            <div class="status-pending">Pending</div>
        </div>
    </div>
</body>
</html>
